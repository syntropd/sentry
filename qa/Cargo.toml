[package]
name = "sentry-qa"
version = "0.6.0"
edition = "2021"
publish = false

[lints.clippy]
duplicate_mod = "allow"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.37", features = ["full"] }
tempfile = "3.10"

[[test]]
name = "tier1_features"
path = "e2e/tier1_features_runner.rs"

[[test]]
name = "tier2_boundaries"
path = "edge/tier2_boundaries_runner.rs"

[[test]]
name = "tier3_combinations"
path = "e2e/tier3_combinations_runner.rs"

[[test]]
name = "tier4_scenarios"
path = "edge/tier4_scenarios_runner.rs"
