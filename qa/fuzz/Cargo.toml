[package]
name = "sentry-fuzz"
version = "0.4.0"
edition = "2021"
publish = false

[workspace]


[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fuzz_journal_parser"
path = "fuzz_targets/fuzz_journal_parser.rs"

[[bin]]
name = "fuzz_dbus_decoder"
path = "fuzz_targets/fuzz_dbus_decoder.rs"

[[bin]]
name = "fuzz_psi_parser"
path = "fuzz_targets/fuzz_psi_parser.rs"

[[bin]]
name = "fuzz_json_triage_decoder"
path = "fuzz_targets/fuzz_json_triage_decoder.rs"
