[workspace]
resolver = "2"
members = [
    "crates/sentry-core",
    "crates/sentry-driver",
    "crates/sentry-diagnostic",
    "crates/sentry-mcp",
    "crates/sentry-safety",
    "crates/sentry-daemon",
    "qa/unit",
]

[workspace.package]
version = "0.3.4"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
authors = ["systemd-sentry contributors"]
repository = "https://github.com/syntropd/sentry"

[workspace.dependencies]
# Internal workspace crates
sentry-core = { package = "syntrop-sentry-core", version = "0.3.4", path = "crates/sentry-core" }
sentry-driver = { package = "syntrop-sentry-driver", version = "0.3.4", path = "crates/sentry-driver" }
sentry-diagnostic = { package = "syntrop-sentry-diagnostic", version = "0.3.4", path = "crates/sentry-diagnostic" }
sentry-mcp = { package = "syntrop-sentry-mcp", version = "0.3.4", path = "crates/sentry-mcp" }
sentry-safety = { package = "syntrop-sentry-safety", version = "0.3.4", path = "crates/sentry-safety" }
sentry-daemon = { package = "syntrop-sentry", version = "0.3.4", path = "crates/sentry-daemon" }

# HTTP client & async traits (pure Rust TLS, zero libssl/libcrypto)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"

# Pure Rust D-Bus (zero libdbus-1.so)
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

# Pure Rust async runtime & system interfaces
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "io-std", "signal", "time", "process"] }
rustix = { version = "0.38", features = ["fs", "net", "process", "event", "param"] }

# Pure Rust serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["std"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

# Error handling
thiserror = { version = "2.0" }

# Time & ID primitives
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Pure Rust TLS (zero OpenSSL / libssl.so / libcrypto.so)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Pure Rust decompression (zero libzstd.so / liblz4.so)
lz4_flex = { version = "0.11" }
ruzstd = { version = "0.7" }

# Observability
tracing = { version = "0.1" }
futures-lite = { version = "2.0" }

# Testing utilities
tempfile = { version = "3.10" }

[profile.release]
# Thin LTO + stripped symbols: smaller, faster binaries, portable x86-64.
lto = "thin"
strip = true
